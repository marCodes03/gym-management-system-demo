<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" fill="none">
  <defs>
    <linearGradient id="lock-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="55%" stop-color="#0B0D11" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="lock-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#D1D5DB" />
      <stop offset="80%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <linearGradient id="lock-gunmetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="lock-royal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Left Shield & Barbell Emblem (Scaled & Centered at Y=120) -->
  <g transform="translate(12, 8) scale(0.88)">
    <!-- Outer Brushed Silver Shield -->
    <path d="M128 14 L224 46 V126 C224 184 182 224 128 244 C74 224 32 184 32 126 V46 L128 14 Z" fill="url(#lock-silver)" />
    <!-- Gunmetal Bevel -->
    <path d="M128 22 L216 51 V125 C216 178 177 215 128 234 C79 215 40 178 40 125 V51 L128 22 Z" fill="url(#lock-gunmetal)" />
    <!-- Royal Blue Rim -->
    <path d="M128 28 L210 55 V124 C210 173 173 208 128 226 C83 208 46 173 46 124 V55 L128 28 Z" fill="url(#lock-royal)" />
    <!-- Obsidian Core -->
    <path d="M128 36 L202 61 V123 C202 167 169 199 128 216 C87 199 54 167 54 123 V61 L128 36 Z" fill="url(#lock-obsidian)" />
    <!-- Top 'M' Monogram -->
    <path d="M74 114 V74 L94 74 L112 98 L128 76 L144 98 L162 74 L182 74 V114 H164 V95 L146 116 H140 L128 100 L116 116 H110 L92 95 V114 H74 Z" fill="url(#lock-silver)" />
    <!-- Lower 'M' Monogram -->
    <path d="M78 142 H96 V174 L114 152 L128 170 L142 152 L160 174 V142 H178 V186 H158 L128 150 L98 186 H78 V142 Z" fill="url(#lock-royal)" />
    <!-- Barbell Shaft & Collar -->
    <rect x="20" y="123" width="216" height="10" rx="3" fill="url(#lock-silver)" stroke="#0B0D11" stroke-width="2" />
    <rect x="104" y="122" width="48" height="12" rx="2" fill="url(#lock-royal)" stroke="#93C5FD" stroke-width="1" />
    <!-- Left Weight Plates -->
    <rect x="8" y="114" width="10" height="28" rx="3" fill="url(#lock-gunmetal)" stroke="#D1D5DB" stroke-width="1.5" />
    <rect x="20" y="102" width="14" height="52" rx="4" fill="url(#lock-silver)" stroke="#0B0D11" stroke-width="2" />
    <rect x="36" y="92" width="16" height="72" rx="4" fill="url(#lock-silver)" stroke="#0B0D11" stroke-width="2" />
    <rect x="41" y="100" width="6" height="56" rx="2" fill="url(#lock-royal)" />
    <!-- Right Weight Plates -->
    <rect x="238" y="114" width="10" height="28" rx="3" fill="url(#lock-gunmetal)" stroke="#D1D5DB" stroke-width="1.5" />
    <rect x="222" y="102" width="14" height="52" rx="4" fill="url(#lock-silver)" stroke="#0B0D11" stroke-width="2" />
    <rect x="204" y="92" width="16" height="72" rx="4" fill="url(#lock-silver)" stroke="#0B0D11" stroke-width="2" />
    <rect x="209" y="100" width="6" height="56" rx="2" fill="url(#lock-royal)" />
    <circle cx="128" cy="196" r="4" fill="#9CA3AF" />
  </g>

  <!-- Right Wordmark Lockup -->
  <!-- Primary Brand Name: MAD MAX -->
  <text x="256" y="112" font-family="Inter, 'Arial Black', system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="3" fill="#0B0D11">
    MAD MAX
  </text>
  <!-- Metallic Top Rim Highlight on Wordmark -->
  <text x="256" y="112" font-family="Inter, 'Arial Black', system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="3" fill="url(#lock-obsidian)">
    MAD MAX
  </text>

  <!-- Royal Blue Rule & GYM Pill -->
  <rect x="258" y="132" width="84" height="6" rx="3" fill="url(#lock-royal)" />
  <text x="356" y="143" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="10" fill="#2563EB">
    GYM
  </text>
  <rect x="466" y="132" width="176" height="6" rx="3" fill="url(#lock-silver)" />

  <!-- Sub-Tagline in Gunmetal / Silver Gray -->
  <text x="258" y="180" font-family="'Geist Mono', 'Roboto Mono', monospace" font-size="14" font-weight="700" letter-spacing="4.5" fill="#4B5563">
    FORGED IN IRON • BUILT FOR SPEED
  </text>
</svg>
